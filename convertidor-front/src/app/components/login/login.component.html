<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-dot"></div>
      <span>SuperConvert</span>
    </div>

    <h2 class="auth-title">Bienvenido de vuelta</h2>
    <p class="auth-sub">Inicia sesión para convertir tus archivos</p>

    <div class="msg-box msg-error" *ngIf="error">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" class="icon-error" stroke-width="2"/>
        <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" class="icon-error" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" class="icon-error" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-group">
        <label>Nombre de usuario</label>
        <input
          type="text"
          formControlName="nombreUsuario"
          placeholder="juanperez"
          autocomplete="username"
          [class.error-input]="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
        <span class="field-error" *ngIf="form.get('nombreUsuario')?.invalid && form.get('nombreUsuario')?.touched">
          Ingresa tu nombre de usuario
        </span>
      </div>

      <div class="field-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="mostrarContrasena ? 'text' : 'password'"
            formControlName="contrasena"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.error-input]="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          <button type="button" class="password-toggle" (click)="toggleContrasena()"
                  [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!mostrarContrasena" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="mostrarContrasena" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="form.get('contrasena')?.invalid && form.get('contrasena')?.touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || cargando">
        <div class="spinner" *ngIf="cargando"></div>
        {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate gratis</a>
    </p>
  </div>
</div>
