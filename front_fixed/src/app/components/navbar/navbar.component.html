<nav class="navbar">
    <div class="navbar-brand" routerLink="/">
        <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" fill="url(#grad)" stroke="none"/>
                <path d="M9 14L12.5 17.5L19 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="grad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FF6B4A"/>
                        <stop offset="1" stop-color="#E63946"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <span class="brand-name">SuperConvert</span>
    </div>


    <div class="navbar-menu">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        <a class="nav-link" routerLink="/convertir/audio" routerLinkActive="active">Audio</a>
        <a class="nav-link" routerLink="/convertir/video" routerLinkActive="active">Video</a>
        <a class="nav-link" routerLink="/convertir/imagen" routerLinkActive="active">Imagen</a>
        <a class="nav-link" routerLink="/historial" routerLinkActive="active" *ngIf="auth.isLoggedIn()">Historial</a>
        <a class="nav-link perfil-link" routerLink="/mi-perfil" routerLinkActive="active" *ngIf="auth.isLoggedIn()">Mi Perfil</a>
        <a class="nav-link admin-link" *ngIf="auth.isAdmin()" routerLink="/admin" routerLinkActive="active">Admin</a>
    </div>

    <div class="navbar-auth">
        <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
            <svg *ngIf="!theme.isDark()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg *ngIf="theme.isDark()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
        <ng-container *ngIf="!auth.isLoggedIn(); else loggedIn">
            <a class="btn-login" routerLink="/login">Acceder</a>
            <a class="btn-register" routerLink="/register">Registro</a>
        </ng-container>
        <ng-template #loggedIn>
            <span class="user-name">{{ auth.getCurrentUser()?.nombre }}</span>
            <button class="btn-logout" (click)="logout()">Salir</button>
        </ng-template>


        <button class="hamburger" (click)="menuAbierto = !menuAbierto" [class.abierto]="menuAbierto" aria-label="Menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</nav>


<div class="sidebar-overlay" [class.visible]="menuAbierto" (click)="menuAbierto = false"></div>


<div class="sidebar" [class.abierto]="menuAbierto">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
                <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" fill="url(#grad2)" stroke="none"/>
                <path d="M9 14L12.5 17.5L19 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="grad2" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FF6B4A"/>
                        <stop offset="1" stop-color="#E63946"/>
                    </linearGradient>
                </defs>
            </svg>
            <span>SuperConvert</span>
        </div>
        <button class="sidebar-close" (click)="menuAbierto = false" aria-label="Cerrar menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="sidebar-links">
        <a class="sidebar-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Inicio
        </a>
        <a class="sidebar-link" routerLink="/convertir/audio" routerLinkActive="active" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Audio
        </a>
        <a class="sidebar-link" routerLink="/convertir/video" routerLinkActive="active" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            Video
        </a>
        <a class="sidebar-link" routerLink="/convertir/imagen" routerLinkActive="active" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Imagen
        </a>
        <a class="sidebar-link" routerLink="/historial" routerLinkActive="active" *ngIf="auth.isLoggedIn()" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Historial
        </a>
        <a class="sidebar-link" routerLink="/mi-perfil" routerLinkActive="active" *ngIf="auth.isLoggedIn()" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Mi Perfil
        </a>
        <a class="sidebar-link sidebar-link-admin" routerLink="/admin" routerLinkActive="active" *ngIf="auth.isAdmin()" (click)="menuAbierto = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Admin
        </a>
    </div>

    <div class="sidebar-footer">
        <ng-container *ngIf="!auth.isLoggedIn(); else sidebarLoggedIn">
            <a class="sidebar-btn-login" routerLink="/login" (click)="menuAbierto = false">Acceder</a>
            <a class="sidebar-btn-register" routerLink="/register" (click)="menuAbierto = false">Registrarse</a>
        </ng-container>
        <ng-template #sidebarLoggedIn>
            <div class="sidebar-user">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                {{ auth.getCurrentUser()?.nombre }}
            </div>
            <button class="sidebar-btn-logout" (click)="logout(); menuAbierto = false">Cerrar sesión</button>
        </ng-template>
    </div>
</div>
